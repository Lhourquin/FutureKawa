services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futurekawa-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_MQTT_URL: ws://localhost:9001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"