services:
  postgres:
    image: postgres:17.9-bookworm
    container_name: futurekawa-br-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: 256mb
    networks:
      - futurekawa-br

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: futurekawa-br-mosquitto
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MQTT_PORT:-1883}:1883
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - futurekawa-br

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  futurekawa-br:
    name: futurekawa-br
