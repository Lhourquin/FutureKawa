services:
  postgres:
    image: postgres:17.9-bookworm
    container_name: futurekawa-br-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: 256mb
    networks:
      - futurekawa-br

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: futurekawa-br-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - futurekawa-br

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: futurekawa-br-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - futurekawa-br

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: futurekawa-br-api:latest
    container_name: futurekawa-br-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: futurekawa-br-backend
      MQTT_MEASUREMENTS_TOPIC: futurekawa/+/+/sensors/+
      PORT: ${API_PORT:-3001}
      NODE_ENV: production
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - futurekawa-br

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  futurekawa-br:
    name: futurekawa-br